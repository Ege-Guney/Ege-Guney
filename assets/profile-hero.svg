<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Ege Guney — Software Engineer</title>
  <desc id="description">A dark editorial banner connecting systems, simulation, and applied AI.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08101E"/>
      <stop offset="0.5" stop-color="#0D1728"/>
      <stop offset="1" stop-color="#10162A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#8B9BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(945 188) rotate(90) scale(225)">
      <stop stop-color="#4F6BFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4F6BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#93A4C7" stroke-opacity="0.08"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="378" rx="27" fill="url(#background)" stroke="#8EA2C9" stroke-opacity="0.18" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="378" rx="27" fill="url(#grid)"/>
  <rect x="690" y="1" width="509" height="378" rx="27" fill="url(#glow)"/>

  <g transform="translate(70 67)">
    <rect width="10" height="10" rx="5" fill="#67E8F9" filter="url(#softGlow)"/>
    <text x="24" y="10" fill="#91A2BC" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3">SOFTWARE ENGINEER · CANADA</text>

    <text y="99" fill="#F7FAFF" font-family="Arial, Helvetica, sans-serif" font-size="61" font-weight="700" letter-spacing="-2">EGE GUNEY</text>
    <rect y="119" width="440" height="2" rx="1" fill="url(#accent)"/>

    <text y="164" fill="#CED7E8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Systems thinking</text>
    <text x="168" y="164" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="20">×</text>
    <text x="193" y="164" fill="#CED7E8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Simulation</text>
    <text x="302" y="164" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="20">×</text>
    <text x="328" y="164" fill="#CED7E8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Applied AI</text>

    <text y="215" fill="#7F90AC" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="0.2">Building software that makes complex behavior visible.</text>
  </g>

  <g transform="translate(760 57)">
    <circle cx="185" cy="133" r="112" stroke="#8194BA" stroke-opacity="0.16"/>
    <circle cx="185" cy="133" r="78" stroke="#8194BA" stroke-opacity="0.12" stroke-dasharray="5 8"/>
    <path d="M185 55V22M107 133H57M263 133H313M185 211V244" stroke="#7590C3" stroke-opacity="0.3"/>
    <path d="M126 77L93 45M244 77L277 45M126 189L93 221M244 189L277 221" stroke="#7590C3" stroke-opacity="0.18"/>

    <circle cx="185" cy="133" r="43" fill="#111E34" stroke="url(#accent)" stroke-width="2"/>
    <text x="185" y="142" text-anchor="middle" fill="#F6FAFF" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="1">EG</text>

    <g transform="translate(129 0)">
      <rect width="112" height="32" rx="16" fill="#101B30" stroke="#67E8F9" stroke-opacity="0.38"/>
      <text x="56" y="20" text-anchor="middle" fill="#B7C7DF" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">SYSTEMS</text>
    </g>
    <g transform="translate(0 117)">
      <rect width="118" height="32" rx="16" fill="#101B30" stroke="#8B9BFF" stroke-opacity="0.38"/>
      <text x="59" y="20" text-anchor="middle" fill="#B7C7DF" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">SIMULATION</text>
    </g>
    <g transform="translate(252 117)">
      <rect width="122" height="32" rx="16" fill="#101B30" stroke="#A78BFA" stroke-opacity="0.42"/>
      <text x="61" y="20" text-anchor="middle" fill="#B7C7DF" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">APPLIED AI</text>
    </g>
    <g transform="translate(129 234)">
      <rect width="112" height="32" rx="16" fill="#101B30" stroke="#67E8F9" stroke-opacity="0.26"/>
      <text x="56" y="20" text-anchor="middle" fill="#B7C7DF" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">PRODUCT</text>
    </g>

    <circle cx="185" cy="22" r="3" fill="#67E8F9" filter="url(#softGlow)"/>
    <circle cx="57" cy="133" r="3" fill="#8B9BFF"/>
    <circle cx="313" cy="133" r="3" fill="#A78BFA"/>
    <circle cx="185" cy="244" r="3" fill="#67E8F9"/>
  </g>
</svg>
